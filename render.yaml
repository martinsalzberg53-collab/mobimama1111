services:
  - type: web
    name: mobi-mama
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: mobi-mama-db
          property: connectionString
      - key: GEMINI_API_KEY
        value: your-gemini-api-key-here
      - key: AT_USERNAME
        value: sandbox
      - key: AT_API_KEY
        value: your-africastalking-api-key-here
      - key: AT_SENDER_ID
        value: MobiMama
      - key: GMAIL_ADDRESS
        value: mobimamagh@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "Mobi Mama <onboarding@resend.dev>"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "Mobi Mama"
      - key: EMAILJS_PUBLIC_KEY
        value: Qy2kiWNUnMlnNACMS
      - key: EMAILJS_PRIVATE_KEY
        value: vLFOxfgSRp_HIOKaF-Ixb
      - key: EMAILJS_SERVICE_ID
        value: service_imq6d4o
      - key: EMAILJS_TEMPLATE_ID
        value: template_qad3awv
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: mobi-mama-db
    databaseName: mobi_mama
    user: mobi_mama
    plan: free
    postgresMajorVersion: "17"
